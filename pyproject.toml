[project]
name = "pkb"
version = "0.1.0"
description = "Planetary Knowledge Base"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "country-converter>=1.3.2",
    "gremlinpython>=3.8.1",
    "ipykernel>=7.2.0",
    "jupyter>=1.1.1",
    "luigi>=3.8.1",
    "lxml>=6.1.1",
    "matplotlib>=3.10.9",
    "neo4j>=6.2.0",
    "nest-asyncio>=1.6.0",
    "networkx>=3.6.1",
    "pandas>=3.0.3",
    "pyarrow>=24.0.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.1",
    "requests-cache>=1.3.2",
    "rich>=15.0.0",
    "tornado>=6.5.6",
    "tqdm>=4.67.3",
    "typer>=0.26.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pkb"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
